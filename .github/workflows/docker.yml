name: Docker Build and Push

on:
  push:
    branches: [production]
    tags: ["*"]
  pull_request:
    branches: [production, main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Heavy tier: everything from light CI, plus Playwright E2E once #44/#45
  # land. A PR to main opts in with the ci:heavy label; PRs to production
  # always run it. The docker job publishes only after this job passes.
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.base.ref == 'production' ||
      (github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'ci:heavy'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:server
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: bash -n deploy/*.sh
      - run: bash deploy/update-drawdb.test.sh
      - run: sudo env "PATH=$PATH" bash deploy/backup.test.sh
      # Last, so a fresh advisory cannot hide test results.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/production' ||
      (startsWith(github.ref, 'refs/tags/') && github.ref_name != 'production'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish production branch image
        if: github.ref == 'refs/heads/production'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:production
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Build and publish Git tag image
        if: startsWith(github.ref, 'refs/tags/') && github.ref_name != 'production'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
